# Windows release packaging for rustydownloads.
#
# What this does, on a v* tag push or a manual run:
#   1. Downloads yt-dlp.exe and ffmpeg.exe at BUILD time (never
#      committed to this repo) into assets/, where build.rs bakes
#      them into rustydownloads.exe with include_bytes!.
#   2. Builds the app with `cargo build --release` on windows-latest.
#   3. Zips rustydownloads.exe + README.md into one release zip
#      and uploads it to the GitHub release.
#
# The end user just unzips that file and runs rustydownloads.exe:
# on first run it extracts yt-dlp and ffmpeg to its own managed
# folder (%LOCALAPPDATA%\rustydownloads\bin), so there are no
# sidecar files and no setup step. People who build from source
# (no assets/ at build time) still get yt-dlp through the in-app
# Download/Update yt-dlp buttons, and ffmpeg from their own install.
#
# Licensing note: yt-dlp is Unlicense; ffmpeg (Gyan essentials
# build) is GPL-licensed. Neither license is the app's MIT license
# -- see README.md "How yt-dlp and ffmpeg are used".

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v0.1.0). Leave empty on a tag push; on a manual run it defaults to the current ref name."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download yt-dlp.exe and ffmpeg.exe (build time only, not committed)
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "assets\yt-dlp.exe"
          .\assets\yt-dlp.exe --version
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-unzip -Force
          Copy-Item (Get-ChildItem -Recurse -Filter ffmpeg.exe ffmpeg-unzip | Select-Object -First 1).FullName "assets\ffmpeg.exe"
          .\assets\ffmpeg.exe -version
          Remove-Item ffmpeg.zip -Force
          Remove-Item ffmpeg-unzip -Recurse -Force

      - name: Build (release)
        run: cargo build --release

      - name: Package release zip
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item target\release\rustydownloads.exe package\
          Copy-Item README.md package\
          Compress-Archive -Path package\* -DestinationPath rustydownloads-windows.zip

      - name: Upload release zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: rustydownloads-windows.zip
